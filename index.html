<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TaskFlow</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="app">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <div class="sidebar__logo">
          <img src="img/Index-logo.png" alt="Logo" />
          <div class="sidebar__logo-support">
            <h1 class="sidebar__title">TaskFlow</h1>
            <p class="sidebar__subtitle">Organize your life</p>
          </div>
        </div>

        <div class="sidebar__lists">
          <h3 class="sidebar__lists-title">MY LISTS</h3>

          <div class="sidebar__list-item sidebar__list-item--active">
            <span class="sidebar__list-item-icon">☀️</span>
            <span class="sidebar__list-item-name">Today</span>
            <span id="today-count" class="sidebar__list-item-count">0</span>
          </div>

          <div class="sidebar__list-item">
            <span class="sidebar__list-item-icon">💼</span>
            <span class="sidebar__list-item-name">Work</span>
            <span id="work-count" class="sidebar__list-item-count">0</span>
          </div>

          <div class="sidebar__list-item">
            <span class="sidebar__list-item-icon">📚</span>
            <span class="sidebar__list-item-name">Study</span>
            <span id="study-count" class="sidebar__list-item-count">0</span>
          </div>

          <div class="sidebar__list-item">
            <span class="sidebar__list-item-icon">👤</span>
            <span class="sidebar__list-item-name">Personal</span>
            <span id="personal-count" class="sidebar__list-item-count">0</span>
          </div>
        </div>

        <div class="sidebar__bottom">
          <button id="dark-mode-btn" class="sidebar__btn">🌙 Dark Mode</button>

          <button id="clear-storage-btn" class="sidebar__btn">
            ♻️ Reset Tasks
          </button>
        </div>
      </aside>

      <!-- MAIN CONTENT -->
      <main class="main-content">
        <!-- TOP BAR -->
        <header class="main-content__top-bar">
          <div class="main-content__organizer">
            <h2 class="main-content__title">☀️ Today</h2>
          </div>

          <div class="main-content__top-controls">
            <input
              type="text"
              placeholder="Search tasks..."
              class="main-content__search-input"
            />

            <select class="main-content__filter-select">
              <option>All</option>
              <option>Completed</option>
              <option>Active</option>
            </select>
          </div>
        </header>

        <!-- ADD TASK -->
        <section class="main-content__add-task-section">
          <input
            type="text"
            placeholder="What needs to be done?"
            class="main-content__task-input"
          />

          <select class="main-content__task-category-select">
            <option value="work">Work</option>
            <option value="personal">Personal</option>
            <option value="study">Study</option>
          </select>

          <button id="add-task-btn" class="main-content__add-task-btn">
            Add Task
          </button>
        </section>
        <!-- TASKS -->
        <section class="main-content__tasks-container">
          <!-- TASK -->
          <div class="main-content__task-card">
            <div class="main-content__task-card-left">
              <input type="checkbox" class="main-content__task-card-checkbox" />

              <p class="main-content__task-card-text">
                Complete JavaScript project
              </p>
            </div>

            <div class="main-content__task-card-right">
              <span
                class="main-content__task-card-tag main-content__task-card-tag--work"
              >
                Work
              </span>

              <button class="main-content__task-card-delete-btn">🗑️</button>
            </div>
          </div>

          <!-- TASK -->
          <div
            class="main-content__task-card main-content__task-card--completed"
          >
            <div class="main-content__task-card-left">
              <input
                type="checkbox"
                class="main-content__task-card-checkbox"
                checked
              />

              <p class="main-content__task-card-text">Morning workout</p>
            </div>

            <div class="main-content__task-card-right">
              <span
                class="main-content__task-card-tag main-content__task-card-tag--personal"
              >
                Personal
              </span>

              <button class="main-content__task-card-delete-btn">🗑️</button>
            </div>
          </div>

          <!-- TASK -->
          <div class="main-content__task-card">
            <div class="main-content__task-card-left">
              <input type="checkbox" class="main-content__task-card-checkbox" />

              <p class="main-content__task-card-text">
                Read 30 pages of a book
              </p>
            </div>

            <div class="main-content__task-card-right">
              <span
                class="main-content__task-card-tag main-content__task-card-tag--study"
              >
                Study
              </span>

              <button class="main-content__task-card-delete-btn">🗑️</button>
            </div>
          </div>
        </section>

        <!-- PROGRESS -->
        <section class="main-content__progress-section">
          <div class="main-content__progress-info">
            <span class="main-content__progress-info-text"
              >3 of 5 tasks completed</span
            >
            <span class="main-content__progress-info-percentage">60%</span>
          </div>

          <div class="main-content__progress-bar">
            <div class="main-content__progress-fill"></div>
          </div>
        </section>
      </main>
    </div>
    <script src="script.js"></script>
    <div class="modal-overlay hidden" id="reset-modal">
      <div class="modal">
        <h3>Reset all tasks?</h3>
        <p>This action will delete all tasks permanently.</p>

        <div class="modal-actions">
          <button id="cancel-reset">Cancel</button>
          <button id="confirm-reset">Reset</button>
        </div>
      </div>
    </div>
  </body>
</html>
